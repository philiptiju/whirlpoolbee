version: "3.9"

services:
  dashboard:
    build: .
    image: claude-local-dashboard:latest
    container_name: claude-dashboard
    ports:
      - "8765:8765"
    volumes:
      - claude-data:/app/data
    # Loads AZURE_AD_CLIENT_ID / AZURE_AD_CLIENT_SECRET / AZURE_AD_TENANT_ID /
    # DASHBOARD_SESSION_SECRET (and anything else) straight from the local,
    # gitignored .env file — see .env.example for the full list of keys.
    env_file:
      - .env
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8765
      # Optional Azure AD (Entra ID) SSO — set all three (plus a persistent
      # DASHBOARD_SESSION_SECRET) in .env to require Microsoft sign-in on
      # every page. Leave .env's values unset for open (no-login) access.
      # See README.md for setup.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  claude-data:
    driver: local
